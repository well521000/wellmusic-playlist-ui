name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 模拟器快速验证：提前发现编译错误，不需要签名，速度快
  build-simulator:
    name: Simulator Build (Quick Check)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Patch iOS 26 compatibility
        run: bash scripts/patch-ios26-compat.sh

      - name: Expo prebuild
        run: npx expo prebuild -p ios --clean

      - name: Force iOS 15 deployment target
        run: |
          sed -i '' 's/platform :ios, .*/platform :ios, "15.0"/' ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/WellMusic.xcodeproj/project.pbxproj
          echo "Deployment target forced to 15.0"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build for Simulator (quick compile check)
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace WellMusic.xcworkspace \
            -scheme WellMusic \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-sim.log | tail -50

  # 真机构建：产出可重签安装的 IPA
  build-ios:
    name: Device Build (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Patch iOS 26 compatibility
        run: bash scripts/patch-ios26-compat.sh

      - name: Expo prebuild
        run: npx expo prebuild -p ios --clean

      - name: Force iOS 15 deployment target
        run: |
          sed -i '' 's/platform :ios, .*/platform :ios, "15.0"/' ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/WellMusic.xcodeproj/project.pbxproj
          echo "Deployment target forced to 15.0"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build IPA (unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace WellMusic.xcworkspace \
            -scheme WellMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -50

      - name: Export IPA
        run: |
          cd ios
          APP_PATH="build/Build/Products/Release-iphoneos/WellMusic.app"
          PAYLOAD_DIR="Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          zip -qr WellMusic-liquidglass.ipa "$PAYLOAD_DIR"
          ls -la WellMusic-liquidglass.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WellMusic-ipa
          path: ios/WellMusic-liquidglass.ipa
